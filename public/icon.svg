<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2f6e"/>
      <stop offset="100%" style="stop-color:#0a1540"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3de8ff"/>
      <stop offset="100%" style="stop-color:#00b8d9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>
  <!-- Subtle inner highlight rim -->
  <rect x="6" y="6" width="500" height="500" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <!-- F letter — bold italic, centred -->
  <text
    x="264" y="368"
    font-family="Arial Black, Arial, sans-serif"
    font-size="340"
    font-weight="900"
    font-style="italic"
    text-anchor="middle"
    fill="url(#letter)"
    filter="url(#glow)"
  >F</text>
</svg>
